# Production-like stack on one machine: MongoDB + quest API + web app.
# Only the web app is published; the API is reachable only inside this network, with a token.
#
#   1. Fill in .env (API + Snowflake, from .env.example) and web/.env.local (logins, from web/.env.example).
#   2. Add API_AUTH_TOKEN to .env:  echo "API_AUTH_TOKEN=$(openssl rand -hex 32)" >> .env
#   3. docker compose up -d --build      then open http://localhost:${WEB_PORT:-3000}
#
# See docs/Deployment.md for hosted deployment, smoke checks, and rollback.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?Set API_AUTH_TOKEN in .env (openssl rand -hex 32)}
      # The key file is mounted below; the host path in .env doesn't exist inside the container.
      SNOWFLAKE_PRIVATE_KEY_PATH: /run/secrets/snowflake_key.p8
    secrets:
      - source: snowflake_key
        target: snowflake_key.p8
    expose:
      - "8080"

  web:
    build: ./web
    restart: unless-stopped
    env_file: web/.env.local
    environment:
      DATABASE_URL: mongodb://mongo:27017/localquest
      QUEST_API_URL: http://api:8080
      QUEST_API_TOKEN: ${API_AUTH_TOKEN:?Set API_AUTH_TOKEN in .env}
      # Auth.js must trust the Host header when it isn't running on Vercel.
      AUTH_TRUST_HOST: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      mongo:
        condition: service_healthy
      api:
        condition: service_healthy

secrets:
  snowflake_key:
    file: ${SNOWFLAKE_PRIVATE_KEY_PATH:?Set SNOWFLAKE_PRIVATE_KEY_PATH in .env to your .p8 key file}

volumes:
  mongo-data:

# Render Blueprint for the quest API (FastAPI, api/Dockerfile). The web app runs on Vercel.
# Render dashboard → New → Blueprint → pick this repo. Render prompts for every `sync: false` value.
# Full walkthrough: docs/Deployment.md → "Vercel + Render + MongoDB Atlas".
services:
  - type: web
    name: local-quest-api
    runtime: docker
    # Docker paths are relative to the repo root; rootDir limits auto-deploys to api/ changes.
    rootDir: api
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    region: ohio # next to Snowflake's AWS us-east-2
    plan: free # sleeps after ~15 min idle; use "starter" to stay awake for a demo
    healthCheckPath: /health
    autoDeployTrigger: checksPass # deploy main only after GitHub CI passes
    envVars:
      - key: APP_ENV
        value: production
      # Random 256-bit value. Copy it into Vercel as QUEST_API_TOKEN.
      - key: API_AUTH_TOKEN
        generateValue: true
      - key: AI_PROVIDER
        value: snowflake
      - key: DATA_PROVIDER
        value: snowflake
      - key: SNOWFLAKE_ACCOUNT
        value: LHXLXHN-WY63275
      - key: SNOWFLAKE_USER
        sync: false
      # Paste the .p8 file's full text (BEGIN ... END lines included). The LQ_API_RENDER key is
      # unencrypted; for an encrypted key, also add SNOWFLAKE_PRIVATE_KEY_PASSPHRASE in the dashboard.
      - key: SNOWFLAKE_PRIVATE_KEY
        sync: false
      - key: SNOWFLAKE_ROLE
        value: LQ_APP_RO
      - key: SNOWFLAKE_WAREHOUSE
        value: LQ_WH
      - key: SNOWFLAKE_DATABASE
        value: LOCAL_QUEST
      - key: SNOWFLAKE_SCHEMA
        value: APP
      - key: SNOWFLAKE_AI_MODEL
        value: llama3.3-70b
      # Route planning takes ~20 s; 40 s leaves room for one repair inside the web app's 90 s wait.
      - key: SNOWFLAKE_QUERY_TIMEOUT_S
        value: "40"
      # Every request arrives from Vercel through Render's proxy, so this per-IP limit is shared by
      # all players. The web app already limits each player to 10 quests per 10 minutes.
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"

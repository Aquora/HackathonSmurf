[project]
name = "local-quest-api"
version = "0.2.0"
description = "Local Quest backend: turns a free-text request and start address into a round-trip quest."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "httpx==0.28.1",
  "uvicorn[standard]==0.54.0",
  "snowflake-connector-python==5.1.0",
  "tzdata>=2026.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

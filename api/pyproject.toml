[project]
name = "local-quest-api"
version = "0.1.0"
description = "Local Quest backend: input normalization, planning orchestration, and route verification."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162,<0.163",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "uvicorn[standard]>=0.54,<0.55",
    "tzdata>=2026.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "httpx2>=2.16,<3",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/adapters/fixture_catalog.py" = ["E501"]  # one-row-per-place table
